[project]
name = "clipy-server"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings", "sqlalchemy>=2",
  "alembic", "httpx", "apscheduler<4", "pillow", "boto3", "tzdata", "python-multipart",
]
[project.optional-dependencies]
asr = ["faster-whisper"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
